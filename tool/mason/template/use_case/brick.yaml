name: use_case
description: Generate a UseCase boilerplate (InputPort / UseCase / Parameter / OutputPort)
version: 0.1.0+1
environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: 'UseCase名をアッパーキャメルケースで入力してください (例: FetchCategoryList)'
    prompt: 'UseCase名を教えてください'
  type:
    type: string
    description: 'UseCaseの種類を入力してください (例: query / command)'
    prompt: 'UseCaseの種類を教えてください'
  output_dir:
    type: string
    description: '出力先のディレクトリを`lib/application/`からの相対パスで入力してください (例: menu)'
    prompt: '生成先のディレクトリを教えてください'
